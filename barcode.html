<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de Códigos de Barras Gratis | EAN-13, Code 128, UPC | QR Free</title>
    <meta name="description" content="Cree códigos de barras gratis en EAN-13, UPC, Code 128, Code 39 e ITF-14. Elija el color y descargue en SVG vectorial o PNG listo para imprimir.">
    <meta name="author" content="QR Free">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://qrfre.com/barcode.html">

    <meta property="og:title" content="QR Free - Generador de Códigos de Barras">
    <meta property="og:description" content="Códigos de barras EAN-13, UPC, Code 128 y más. Descarga en SVG o PNG.">
    <meta property="og:image" content="https://qrfre.com/escaneo-de-codigo-qr.png">
    <meta property="og:url" content="https://qrfre.com/barcode.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="QR Free">
    <meta property="og:locale" content="es_ES">
    <meta name="twitter:card" content="summary">

    <link rel="icon" type="image/png" href="escaneo-de-codigo-qr.png">
    <link rel="apple-touch-icon" href="escaneo-de-codigo-qr.png">
    <meta name="theme-color" content="#0f172a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <meta name="google-adsense-account" content="ca-pub-6481587162431047">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6481587162431047" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>
    <nav class="navbar" aria-label="Principal">
        <div class="navbar-container">
            <a class="brand" href="./"><i class="fa-solid fa-qrcode" aria-hidden="true"></i> QR Free</a>
            <div class="nav-links">
                <a href="./"><i class="fa-solid fa-qrcode" aria-hidden="true"></i> <span>Individual</span></a>
                <a href="bulk.html"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> <span>Masivo</span></a>
                <a href="barcode.html" class="active" aria-current="page"><i class="fa-solid fa-barcode" aria-hidden="true"></i> <span>Código de Barras</span></a>
            </div>
        </div>
    </nav>

    <main class="main-wrapper">
        <div class="page-header">
            <h1>Generador de Códigos de Barras</h1>
            <p>Genere etiquetas compatibles con escáneres de tienda y logística (EAN, Code 128, UPC).</p>
        </div>

        <div class="workspace-grid">
            <section class="panel">
                <h2 class="panel-title"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Parámetros</h2>

                <div class="form-group">
                    <label for="barcode-format">Formato Estándar</label>
                    <select id="barcode-format" onchange="generateBarcode()">
                        <option value="CODE128">Code 128 (Logística General)</option>
                        <option value="EAN13">EAN-13 (Retail/Productos)</option>
                        <option value="UPC">UPC (Retail USA)</option>
                        <option value="CODE39">Code 39 (Industria/Automotriz)</option>
                        <option value="ITF14">ITF-14 (Cajas de embalaje)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="barcode-value">Valor / Código</label>
                    <input type="text" id="barcode-value" placeholder="Ej: 123456789" value="CODE-128-TEST" oninput="generateBarcode()">
                    <small class="hint">EAN-13: 12 o 13 dígitos · UPC: 11 o 12 dígitos · ITF-14: 13 o 14 dígitos.</small>
                </div>

                <div class="form-group">
                    <label for="bar-color">Color de Barras</label>
                    <input type="color" id="bar-color" value="#000000" oninput="generateBarcode()">
                </div>

                <div class="form-group">
                    <label for="show-text">Mostrar Texto Debajo</label>
                    <select id="show-text" onchange="generateBarcode()">
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select>
                </div>
            </section>

            <section class="panel preview-container">
                <h2><i class="fa-solid fa-print" aria-hidden="true"></i> Resultado</h2>
                <div class="barcode-box">
                    <svg id="barcode" role="img" aria-label="Código de barras generado"></svg>
                    <p id="barcode-error" class="error-text" role="alert" hidden></p>
                </div>
                <div class="preview-actions">
                    <div class="form-group">
                        <label for="barcode-dl-format">Formato de Descarga</label>
                        <select id="barcode-dl-format">
                            <option value="svg">SVG (Vectorial)</option>
                            <option value="png">PNG (Alta resolución)</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary" id="btn-download-barcode" onclick="downloadBarcode()">
                        <i class="fa-solid fa-file-export" aria-hidden="true"></i> Descargar
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', generateBarcode);
    </script>
</body>
</html>
