<div class="workspace-grid">

    <section class="panel" aria-label="Configuración del código QR">

        <h2 class="panel-title"><i class="fa-solid fa-database" aria-hidden="true"></i> 1. Datos del Código</h2>

        <div class="form-group">
            <div class="type-grid" role="group" aria-label="Tipo de contenido">
                <button type="button" class="type-btn active" aria-pressed="true" data-type="url" onclick="setType('url', this)"><i class="fa-solid fa-link" aria-hidden="true"></i> URL</button>
                <button type="button" class="type-btn" aria-pressed="false" data-type="whatsapp" onclick="setType('whatsapp', this)"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> WhatsApp</button>
                <button type="button" class="type-btn" aria-pressed="false" data-type="wifi" onclick="setType('wifi', this)"><i class="fa-solid fa-wifi" aria-hidden="true"></i> WiFi</button>
                <button type="button" class="type-btn" aria-pressed="false" data-type="vcard" onclick="setType('vcard', this)"><i class="fa-regular fa-address-card" aria-hidden="true"></i> VCard</button>
                <button type="button" class="type-btn" aria-pressed="false" data-type="email" onclick="setType('email', this)"><i class="fa-regular fa-envelope" aria-hidden="true"></i> Email</button>
                <button type="button" class="type-btn" aria-pressed="false" data-type="phone" onclick="setType('phone', this)"><i class="fa-solid fa-phone" aria-hidden="true"></i> Teléfono</button>
                <button type="button" class="type-btn" aria-pressed="false" data-type="sms" onclick="setType('sms', this)"><i class="fa-solid fa-comment-sms" aria-hidden="true"></i> SMS</button>
                <button type="button" class="type-btn" aria-pressed="false" data-type="text" onclick="setType('text', this)"><i class="fa-solid fa-font" aria-hidden="true"></i> Texto</button>
                <button type="button" class="type-btn" aria-pressed="false" data-type="geo" onclick="setType('geo', this)"><i class="fa-solid fa-map-location-dot" aria-hidden="true"></i> Mapa</button>
            </div>
        </div>
        <div id="dynamic-inputs"></div>

        <h2 class="panel-title spaced"><i class="fa-solid fa-paintbrush" aria-hidden="true"></i> 2. Personalización Visual</h2>

        <div class="grid-2">
            <div class="subpanel">
                <h3 class="subpanel-title">Cuerpo (Datos)</h3>
                <div class="form-group">
                    <label for="qr-dots-type">Forma Puntos</label>
                    <select id="qr-dots-type" onchange="updateDesign()">
                        <option value="square">Cuadrado</option>
                        <option value="rounded">Redondo</option>
                        <option value="dots">Puntos</option>
                        <option value="classy">Classy</option>
                        <option value="classy-rounded">Classy Smooth</option>
                        <option value="extra-rounded">Extra Redondo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="colorDots">Color Puntos</label>
                    <div class="color-field">
                        <input type="color" id="colorDots" value="#0f172a" oninput="updateDesign()">
                        <span>Principal</span>
                    </div>
                </div>
            </div>

            <div class="subpanel">
                <h3 class="subpanel-title">Esquinas (Ojos)</h3>
                <div class="form-group">
                    <label for="qr-corner-type">Forma Esquinas</label>
                    <select id="qr-corner-type" onchange="updateDesign()">
                        <option value="square">Cuadrado</option>
                        <option value="extra-rounded">Redondeado</option>
                        <option value="dot">Círculo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="colorCorners">Color Esquinas</label>
                    <div class="color-field">
                        <input type="color" id="colorCorners" value="#0f172a" oninput="updateDesign()">
                        <span>Ojos</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-20">
            <h3 class="section-title">3. Fondo y Branding</h3>
            <div class="grid-1-2">
                <div class="form-group">
                    <label for="colorBg">Color Fondo</label>
                    <input type="color" id="colorBg" value="#ffffff" oninput="updateDesign()">
                </div>

                <div class="form-group">
                    <span class="field-label">Logotipo Central</span>
                    <div class="logo-upload-container">
                        <button type="button" class="upload-placeholder" id="logoUploadPlaceholder" onclick="document.getElementById('logoInput').click()">
                            <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                            <span>Subir Logo</span>
                        </button>
                        <div class="logo-preview-wrapper" id="logoPreviewArea" hidden>
                            <img alt="Vista previa del logo" class="logo-preview-img" id="imgPreview">
                            <button type="button" class="btn btn-danger" onclick="removeLogo(event)" aria-label="Quitar logo">X</button>
                        </div>
                        <input type="file" id="logoInput" accept="image/*" hidden onchange="handleLogoUpload(this)">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <span class="field-label">O elija un ícono (toma el color de los puntos)</span>
                <div class="icon-grid" id="icon-presets"></div>
            </div>
        </div>

    </section>

    <section class="panel preview-container" aria-label="Vista previa">
        <h2>Vista Previa</h2>

        <div id="canvas"></div>

        <div class="preview-actions">
            <div class="form-group">
                <label for="dl-format">Formato de Descarga</label>
                <select id="dl-format">
                    <option value="png">PNG (Imagen)</option>
                    <option value="svg">SVG (Vectorial)</option>
                    <option value="jpeg">JPEG</option>
                </select>
            </div>
            <button type="button" class="btn btn-primary" onclick="downloadQR()">
                <i class="fa-solid fa-download" aria-hidden="true"></i> Descargar QR
            </button>
        </div>
    </section>
</div>
